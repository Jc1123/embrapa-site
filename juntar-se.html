<body>
    <header>

    <main>
        <div class="glass-card">
            <h2>Formulário de Recrutamento</h2>
            <p>Preencha os dados abaixo para iniciar o recrutamento</p>
            
            <form id="recrutamento-form">
                <div class="form-group">
                    <label for="nick">Seu Nick no Jogo</label>
                    <input type="text" id="nick" placeholder="Ex: Nick do Minecraft" required>
                </div>
                <div class="form-group">
                    <label for="contato">Contato (Discord / WhatsApp)</label>
                    <input type="text" id="contato" placeholder="" required>
                </div>
                <button type="submit" class="btn-submit">Enviar Solicitação</button>
            </form>
        </div>
    </main>

    <footer>
        <a href="https://discord.gg/JsUuF7ePfX" target="_blank" class="discord-btn">
            <img src="assets/discord-logo.svg" alt="Discord">
            Entrar no Discord
        </a>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/recrutamento.js"></script>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membros | EMBRAPA</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <header class="site-header">
        <h1>EMBRAPA</h1>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Sobre Nós</a></li>
                <li><a href="juntar-se.html">Juntar-se</a></li>
                <li><a href="membros.html">Membros</a></li>
                <li><a href="wiki.html">Wiki & Regras</a></li>
                <li><a href="admin.html">Administração</a></li>
            </ul>
        </nav>
    </header>

    <main class="centered">
        <h2>Nossos Membros</h2>

        <section class="members-tools" aria-label="Busca e filtros de membros">
            <label for="search-membro" class="sr-only">Pesquisar por nick</label>
            <input
                type="search"
                id="search-membro"
                class="search-input"
                placeholder="Pesquisar por nick..."
                autocomplete="off"
            >

            <div class="filters-container" id="filters-container">
                <button type="button" class="filter-btn active" data-cargo="Todos">Todos</button>
            </div>
        </section>

        <section id="membros-grid" class="members-grid" aria-live="polite">
            <p class="empty-state">Carregando lista do servidor...</p>
        </section>
    </main>

    <footer class="site-footer">
        <a href="https://discord.gg/JsUuF7ePfX" target="_blank" rel="noopener noreferrer" class="discord-btn">
            <img src="assets/discord-logo.svg" alt="" aria-hidden="true">
            Entrar no Discord
        </a>
    </footer>

    <div
        id="modal-perfil"
        class="modal-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="perfil-nick"
        aria-hidden="true"
    >
        <div class="glass-card perfil-card">
            <button id="fechar-perfil" type="button" class="btn-fechar" aria-label="Fechar perfil">&times;</button>

            <div class="perfil-header">
                <img id="perfil-skin" src="" alt="" class="perfil-skin-large">
                <div class="perfil-info">
                    <h2 id="perfil-nick">Nick</h2>
                    <span id="perfil-cargo">Cargo</span>
                </div>
            </div>

            <div class="perfil-detalhes">
                <div class="detalhe-item">
                    <strong>⚔️ Status:</strong>
                    <span class="cargo-fazendeiro">Ativo</span>
                </div>

                <div class="detalhe-item">
                    <strong>📅 Entrou em:</strong>
                    <span id="perfil-data">Não informada</span>
                </div>

                <div class="detalhe-item">
                    <strong>📝 Sobre:</strong>
                    <p id="perfil-bio">Sem biografia informada.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/membros.js"></script>
</body>
</html>
